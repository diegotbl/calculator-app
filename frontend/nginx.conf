# Serves the built frontend and forwards the API call to the backend container,
# so the browser sees one origin and the backend needs no CORS handling -- the
# same arrangement Vite's dev proxy provides in development (DECISIONS.md T4).

server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        # No client-side router in this app, so an unknown path really is a
        # missing file: 404 it rather than falling back to index.html, which
        # would answer 200 for every typo and contradict the documented
        # "unknown path -> 404" (README, Error summary).
        try_files $uri $uri/ =404;
    }

    location /calculate {
        # Deliberately above the backend's own 1 MiB cap (DECISIONS.md T18) so an
        # oversized body reaches the backend and the client gets its JSON
        # {"error":"request body too large"}, not nginx's HTML 413 page.
        client_max_body_size 2m;

        # "backend" is the compose service name, resolved by Docker's DNS.
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
